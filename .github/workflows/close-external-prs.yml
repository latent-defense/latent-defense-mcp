name: Close external PRs

on:
  pull_request_target:
    types: [opened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: membership } = await github.rest.orgs.checkMembershipForUser({
              org: 'latent-defense',
              username: context.payload.pull_request.user.login,
            }).catch(() => ({ data: null }));

            if (!membership || membership.state !== 'active') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: 'Thank you for your interest. This repository does not accept external contributions. Please reach out to your account team for support.',
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                state: 'closed',
              });
            }
